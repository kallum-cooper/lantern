services:
  lantern:
    build: .
    container_name: lantern
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4173:4173"
    environment:
      PORT: 4173
      LANTERN_DATA: /app/data/lantern.json
      LANTERN_DATABASE_URL: postgres://lantern:lantern@db:5432/lantern
    volumes:
      - lantern-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lantern
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: lantern
    volumes:
      - lantern-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern -d lantern"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lantern-data:
  lantern-postgres:
